<!DOCTYPE html>
<html lang="und">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dr. Osvaldo L. Santos-Pereira — Language Selection / Seleção de idioma</title>
  <meta name="description" content="Language selection page for the academic website of Dr. Osvaldo L. Santos-Pereira. Choose Portuguese or English according to your browser language or manually." />
  <link rel="canonical" href="https://ozsp12.github.io/" />
  <link rel="alternate" hreflang="pt" href="https://ozsp12.github.io/pt/" />
  <link rel="alternate" hreflang="en" href="https://ozsp12.github.io/en/" />
  <link rel="alternate" hreflang="x-default" href="https://ozsp12.github.io/" />
</head>
<body>
  <p>
    <span lang="pt">Selecione o idioma:</span>
    <a href="/pt/" hreflang="pt" lang="pt">Português</a>
    ·
    <span lang="en">Select language:</span>
    <a href="/en/" hreflang="en" lang="en">English</a>
  </p>
  <script>
    var lang = (navigator.language || 'pt').toLowerCase().indexOf('en') === 0 ? 'en' : 'pt';
    window.location.replace('/' + lang + '/');
  </script>
</body>
</html>
