name: Fix accessibility lint

on:
  push:
    branches: [agent/research-cards-site-polish-v3]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/research-cards-site-polish-v3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/fix_accessibility_lint.py
      - run: npx --yes html-validate@9.7.1 "index.html" "404.html" "en/**/*.html" "pt/**/*.html"
      - run: rm scripts/fix_accessibility_lint.py .github/workflows/fix-accessibility-lint.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix mobile navigation accessibility lint"
          git push origin HEAD:agent/research-cards-site-polish-v3
