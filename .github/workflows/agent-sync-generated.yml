name: Agent sync generated pages

on:
  push:
    branches:
      - agent/about-home-editorial-refactor

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Regenerate Home and About pages')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/about-home-editorial-refactor
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regenerate site
        run: python scripts/build_site.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html pt/index.html en/about/index.html pt/about/index.html
          if git diff --cached --quiet; then
            echo "Generated pages already in sync."
          else
            git commit -m "Regenerate Home and About pages"
            git push origin HEAD:agent/about-home-editorial-refactor
          fi
