name: Bootstrap shared layout sources

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_site.py'
      - 'templates/base.html'
      - 'templates/partials/**'
      - '.github/workflows/bootstrap-layout.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Extract page sources and rebuild
        run: python scripts/build_site.py --bootstrap

      - name: Validate generated site
        run: python scripts/validate_site.py

      - name: Commit migration output
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No migration output to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/pages pt en
          git commit -m "Generate pages from shared layout sources"
          git push
