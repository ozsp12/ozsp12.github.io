name: Agent rebuild teaching research theme

on:
  push:
    branches:
      - agent/teaching-research-dark-theme

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/teaching-research-dark-theme
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate site
        run: python scripts/build_site.py
      - name: Validate site
        run: |
          python scripts/build_site.py --check
          python scripts/validate_site.py
          npx --yes html-validate@9.7.1 "index.html" "404.html" "en/**/*.html" "pt/**/*.html"
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/agent-rebuild-teaching-research-theme.yml'
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Regenerate teaching research and theme updates"
            git push origin HEAD:agent/teaching-research-dark-theme
          fi
