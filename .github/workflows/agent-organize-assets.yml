name: Agent organize cinematic assets

on:
  push:
    branches:
      - agent/organize-assets-cinematic

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/organize-assets-cinematic
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Update asset references and Home
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          cinematic = [
              'artificial_intelligence.png', 'black_hole.png', 'complex_system.png',
              'complex_system2.png', 'cosmo_quantum_2.png', 'cosmology.png',
              'cosmos_quantum.png', 'general_relativity.png', 'notag1.png',
              'notag2.png', 'quantum.png', 'quantum_computing.png',
              'topology.png', 'warp_drive.png',
          ]
          text_suffixes = {'.html', '.py', '.md', '.json', '.css', '.js', '.xml', '.txt', '.yml', '.yaml'}
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for name in cinematic:
                  updated = updated.replace(f'assets/{name}', f'assets/cinematic/{name}')
              updated = updated.replace('assets/project-lstm.jpg', 'assets/minimalist/project-lstm.jpg')
              updated = updated.replace('assets/research-complex-systems.jpg', 'assets/cinematic/complex_system2.png')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          for rel in ('templates/pages/en/home.html', 'templates/pages/pt/home.html'):
              path = root / rel
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(
                  r'\n<section aria-labelledby="featured-project-title" class="home-featured">.*?</section>\n(?=</main>)',
                  '\n', text, flags=re.DOTALL
              )
              if count != 1:
                  raise SystemExit(f'Expected one featured Home section in {rel}, found {count}')
              path.write_text(text, encoding='utf-8')

          build = root / 'scripts/build_site.py'
          text = build.read_text(encoding='utf-8')
          old = '''    if key == "home":\n        extra_style_links.append('<link href="/css/home-featured.css?v=1" rel="stylesheet"/>')\n'''
          if old not in text:
              raise SystemExit('Home featured stylesheet hook not found in build_site.py')
          build.write_text(text.replace(old, ''), encoding='utf-8')

          validator = root / 'scripts/validate_site.py'
          text = validator.read_text(encoding='utf-8')
          text = re.sub(r'^\s*["\']css/home-featured\.css["\'],?\s*\n', '', text, flags=re.MULTILINE)
          validator.write_text(text, encoding='utf-8')

          css = root / 'css/home-featured.css'
          if css.exists():
              css.unlink()
          PY
      - name: Regenerate site
        run: python scripts/build_site.py
      - name: Verify obsolete asset paths are gone
        run: |
          if grep -R -nE 'assets/(artificial_intelligence|black_hole|complex_system|complex_system2|cosmo_quantum_2|cosmology|cosmos_quantum|general_relativity|notag1|notag2|quantum|quantum_computing|topology|warp_drive)\.png|assets/project-lstm\.jpg|assets/research-complex-systems\.jpg' templates scripts index.html en pt README.md 2>/dev/null; then
            echo 'Obsolete asset reference found.'
            exit 1
          fi
      - name: Validate build
        run: |
          python scripts/build_site.py --check
          python scripts/validate_site.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update site for cinematic asset layout"
          git push origin HEAD:agent/organize-assets-cinematic
