name: Agent refine Home headline

on:
  push:
    branches:
      - agent/refine-home-headline-affiliation

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/refine-home-headline-affiliation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refine headline and English affiliation
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('.')

          en_home = repo / 'templates/pages/en/home.html'
          text = en_home.read_text(encoding='utf-8')
          old_aff = 'Instituto de Física da Universidade Federal do Rio de Janeiro (UFRJ)'
          new_aff = 'Physics Institute of Universidade Federal do Rio de Janeiro (UFRJ)'
          count = text.count(old_aff)
          if count < 2:
              raise SystemExit(f'Expected affiliation at least twice in EN Home, found {count}')
          en_home.write_text(text.replace(old_aff, new_aff), encoding='utf-8')

          en_about = repo / 'templates/pages/en/about.html'
          text = en_about.read_text(encoding='utf-8')
          if old_aff not in text:
              raise SystemExit('Expected Portuguese affiliation in EN About')
          en_about.write_text(text.replace(old_aff, new_aff), encoding='utf-8')

          css = repo / 'css/styles.css'
          text = css.read_text(encoding='utf-8')
          old_rule = '.hero-headline { margin: 0 0 10px; max-width: 560px; font-family: var(--serif); font-size: clamp(26px, 2.3vw, 34px); line-height: 1.12; font-weight: 500; letter-spacing: -0.018em; color: var(--text); }'
          new_rule = '.hero-headline { margin: 0 0 10px; max-width: 530px; font-family: var(--serif); font-size: clamp(22px, 1.9vw, 29px); line-height: 1.16; font-weight: 500; letter-spacing: -0.012em; color: var(--text); }'
          if old_rule not in text:
              raise SystemExit('Desktop hero headline rule not found')
          text = text.replace(old_rule, new_rule)
          old_mobile = '.hero-headline { font-size: clamp(25px, 7vw, 30px); max-width: 540px; }'
          new_mobile = '.hero-headline { font-size: clamp(22px, 6vw, 27px); max-width: 520px; }'
          if old_mobile not in text:
              raise SystemExit('Mobile hero headline rule not found')
          css.write_text(text.replace(old_mobile, new_mobile), encoding='utf-8')
          PY
      - name: Regenerate static site
        run: python scripts/build_site.py
      - name: Validate generated site
        run: |
          python scripts/build_site.py --check
          python scripts/validate_site.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/agent-home-headline.yml'
          git commit -m "Refine Home headline hierarchy and EN affiliation"
          git push origin HEAD:agent/refine-home-headline-affiliation
