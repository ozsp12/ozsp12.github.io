name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check generated files are in sync
        run: python scripts/build_site.py --check

      - name: Regenerate static site
        run: python scripts/build_site.py

      - name: Confirm build is idempotent
        run: |
          git diff --exit-code
          python scripts/build_site.py
          git diff --exit-code

      - name: Validate static site
        run: python scripts/validate_site.py

      - name: Validate LSTM dashboard structure
        run: node scripts/validate_lstm_dashboard.mjs

      - name: Validate HTML and accessibility semantics
        run: npx --yes html-validate@9.7.1 "index.html" "404.html" "en/**/*.html" "pt/**/*.html"
