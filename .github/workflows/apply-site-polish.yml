name: Apply site polish migration

on:
  push:
    branches: [agent/research-cards-site-polish-v2]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/research-cards-site-polish-v2
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply source migration
        run: python scripts/apply_site_polish.py
      - name: Regenerate static site
        run: python scripts/build_site.py
      - name: Validate deterministic site
        run: |
          python scripts/build_site.py --check
          python scripts/validate_site.py
      - name: Remove one-shot migration files
        run: rm scripts/apply_site_polish.py .github/workflows/apply-site-polish.yml
      - name: Commit generated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "polish research, projects, homepage, and SEO"
          git push origin HEAD:agent/research-cards-site-polish-v2
