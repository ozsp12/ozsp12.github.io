name: Sync generated site for projects test

on:
  push:
    branches: [agent/projects-navigation-test]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/projects-navigation-test
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Regenerate site
        run: python scripts/build_site.py

      - name: Commit generated outputs
        run: |
          if git diff --quiet; then
            echo "Generated site already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pt en sitemap.xml robots.txt
          git commit -m "build: regenerate projects navigation"
          git push origin HEAD:agent/projects-navigation-test
